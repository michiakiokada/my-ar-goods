<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小さな森の研究所 - スーパーリーチ（群）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-width: 1200px;
      max-height: 675px;
      overflow: hidden;
      background: #000;
    }
    .shake { animation: screen-shake 0.1s infinite; }
    @keyframes screen-shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 3px); }
      50% { transform: translate(3px, -3px); }
      75% { transform: translate(-3px, -2px); }
      100% { transform: translate(2px, 2px); }
    }
    #bg {
      position: absolute; width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.0);
      transition: transform 15s ease-out;
    }
    #stage.sp-playing #bg { transform: scale(1.08); }

    #swarm-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 60; overflow: hidden;
    }
    .swarm-item {
      position: absolute; right: -250px; will-change: right, transform;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
    }
    .action-kinoko { animation: kinoko-dash 0.16s ease-in-out infinite alternate; }
    @keyframes kinoko-dash {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-18px) rotate(4deg); }
    }
    .action-ishi { animation: ishi-roll 0.4s linear infinite; }
    @keyframes ishi-roll {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    .action-wakaba { animation: wakaba-float 0.5s ease-in-out infinite alternate; }
    @keyframes wakaba-float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-24px); }
    }

    #kinoko {
      position: absolute; bottom: 5%; left: 50%;
      transform: translateX(-50%) scale(0);
      height: 60%; z-index: 20; transform-origin: bottom center;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
      transition: transform 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    #kinoko.show { transform: translateX(-50%) scale(1.0); }
    .dance-kinoko {
      animation: kinoko-sway 0.8s ease-in-out infinite alternate,
                 kinoko-breathe 1.6s ease-in-out infinite alternate !important;
    }
    @keyframes kinoko-sway {
      0% { transform: translateX(-50%) rotate(-3deg); }
      100% { transform: translateX(-50%) rotate(3deg); }
    }
    @keyframes kinoko-breathe {
      0% { transform: translateX(-50%) scale(1.0, 1.0); }
      100% { transform: translateX(-50%) scale(1.03, 0.98); }
    }
    .jump { animation: jump-anim 0.4s ease-in-out infinite alternate !important; }
    @keyframes jump-anim {
      0% { transform: translateX(-50%) translateY(0); }
      100% { transform: translateX(-50%) translateY(-25px); }
    }

    #smoke {
      position: absolute; top: -20%; left: 50%;
      transform: translateX(-50%) scale(0);
      width: 80%; z-index: 25; opacity: 0; pointer-events: none;
      transition: all 1.2s cubic-bezier(0.1, 0.8, 0.3, 1);
    }
    #smoke.active { transform: translateX(-50%) scale(1.3); opacity: 0.95; }
    #smoke.fade { opacity: 0; transform: translateX(-50%) scale(1.6) translateY(-50px); transition: all 2.5s ease-out; }

    #ishi {
      position: absolute; bottom: 5%; left: -35%;
      height: 42%; z-index: 22; transform-origin: bottom center;
      transition: left 1.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }
    #ishi.active { left: 12%; animation: ishi-bounce 0.8s ease-in-out infinite alternate; }
    @keyframes ishi-bounce {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }

    #wakaba {
      position: absolute; bottom: 5%; right: -35%;
      height: 52%; z-index: 22; transform-origin: bottom center;
      transition: right 1.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }
    #wakaba.active { right: 12%; animation: wakaba-sway 0.8s ease-in-out infinite alternate; }
    @keyframes wakaba-sway {
      0% { transform: translateY(0) rotate(3deg); }
      100% { transform: translateY(-12px) rotate(-3deg); }
    }

    #confetti { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }
    #curtain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #curtain.blackout { opacity: 0.94; }
    #curtain.fade-out { opacity: 1; transition: opacity 3s ease-in-out; }

    #result-banner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      color: #fff;
      font-size: clamp(24px, 4.5vw, 42px);
      font-weight: bold;
      z-index: 150; opacity: 0;
      transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      text-shadow: 0 0 25px rgba(255,215,0,0.9), 0 4px 15px #000;
      text-align: center;
      width: 90%;
      line-height: 1.4;
    }
    #result-banner.show { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }

    /* 初回タップ待機オーバーレイ（音再生ブロック対策） */
    #tap-to-start {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 200; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.4);
      color: #fff; font-size: 18px; font-weight: bold;
    }
  </style>
</head>
<body>

<div id="stage">
  <img id="bg" src="sp_bg.png" alt="背景">

  <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
    <img id="smoke" src="sp_smoke.png" alt="毒の煙">
    <img id="kinoko" src="sp_kinoko.png" alt="毒キノコちゃん">
  </div>
  <img id="ishi" src="sp_ishi.png" alt="石ちゃん">
  <img id="wakaba" src="sp_wakaba.png" alt="若葉ちゃん">

  <div id="swarm-container"></div>
  <canvas id="confetti"></canvas>
  <div id="curtain"></div>
  <div id="result-banner"></div>

  <div id="tap-to-start" onclick="initStart()">
    <span>画面をタップして観測開始</span>
  </div>
</div>

<audio id="audio" src="theme.mp3" preload="auto"></audio>

<script>
  const stage = document.getElementById('stage');
  const swarmContainer = document.getElementById('swarm-container');
  const curtain = document.getElementById('curtain');
  const resultBanner = document.getElementById('result-banner');
  const audio = document.getElementById('audio');
  const kinoko = document.getElementById('kinoko');
  const smoke = document.getElementById('smoke');
  const ishi = document.getElementById('ishi');
  const wakaba = document.getElementById('wakaba');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const tapOverlay = document.getElementById('tap-to-start');

  let isPlaying = false;
  let confettiActive = false;
  let particles = [];

  function resizeCanvas() {
    canvas.width = stage.clientWidth;
    canvas.height = stage.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playGekiatsuSE() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2400, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  // 通常モードへ戻る処理
  function returnToNormal() {
    curtain.classList.add('fade-out');
    setTimeout(() => {
      if (window.history.length > 1) {
        window.history.back(); // 前のカメラ画面へ戻る
      } else {
        window.location.href = '../index.html'; // フォールバック
      }
    }, 1500);
  }

  function initStart() {
    if (isPlaying) return;
    tapOverlay.style.display = 'none';
    if (audioCtx.state === 'suspended') audioCtx.resume();
    startSwarmReach();
  }

  // ◯群演出（約10秒）
  function startSwarmReach() {
    isPlaying = true;
    playGekiatsuSE();

    // キノコ・石・若葉からランダムで1種選択
    const types = ['kinoko', 'ishi', 'wakaba'];
    const selectedType = types[Math.floor(Math.random() * types.length)];

    if (selectedType === 'ishi') {
      stage.classList.add('shake');
      setTimeout(() => stage.classList.remove('shake'), 8500);
    }

    let imgSrc = '';
    let actionClass = '';
    if (selectedType === 'kinoko') {
      imgSrc = 'sp_kinoko.png';
      actionClass = 'action-kinoko';
    } else if (selectedType === 'ishi') {
      imgSrc = 'sp_ishi.png';
      actionClass = 'action-ishi';
    } else if (selectedType === 'wakaba') {
      imgSrc = 'sp_wakaba.png';
      actionClass = 'action-wakaba';
    }

    // 130体の超大群
    const totalCount = 130;
    for (let i = 0; i < totalCount; i++) {
      createSwarmItem(imgSrc, actionClass);
    }

    // 約9.5秒流れて判定へ
    setTimeout(() => {
      judgeResult();
    }, 9500);
  }

  function createSwarmItem(src, actionClass) {
    const img = document.createElement('img');
    img.src = src;
    img.className = `swarm-item ${actionClass}`;

    const size = Math.random() * 90 + 90;
    const topPercent = Math.random() * 65 + 10;
    const delay = Math.random() * 5.5; // 出現時間差
    const speed = Math.random() * 0.4 + 2.4;

    img.style.height = `${size}px`;
    img.style.top = `${topPercent}%`;
    img.style.transition = `right ${speed}s cubic-bezier(0.2, 0.8, 0.4, 1) ${delay}s`;

    swarmContainer.appendChild(img);

    requestAnimationFrame(() => {
      img.style.right = '120%';
    });

    setTimeout(() => {
      img.remove();
    }, (delay + speed + 0.5) * 1000);
  }

  // ガチ当落判定（1/4 = 25%）
  function judgeResult() {
    curtain.classList.add('blackout');

    setTimeout(() => {
      const isWin = (Math.random() < 0.25);

      if (isWin) {
        resultBanner.innerHTML = '🎉 大 当 た り 🎉<br><span style="font-size: 0.7em; color: #ffd700;">奇跡の観測に成功！</span>';
        resultBanner.classList.add('show');
        audio.play();

        setTimeout(() => {
          resultBanner.classList.remove('show');
          curtain.classList.remove('blackout');
          startSpecialLivePerformance();
        }, 1800);

      } else {
        resultBanner.innerHTML = '【 観 測 終 了 】<br><span style="font-size: 0.85em; color: #90a4ae;">……異常なし（通常へ）</span>';
        resultBanner.classList.add('show');

        // ハズレ後は通常カメラへ戻る
        setTimeout(() => {
          returnToNormal();
        }, 2200);
      }
    }, 1200);
  }

  function startSpecialLivePerformance() {
    stage.classList.add('sp-playing');
    kinoko.classList.add('show', 'dance-kinoko');
  }

  audio.addEventListener('timeupdate', () => {
    const sec = audio.currentTime;
    if (sec >= 17.0 && !smoke.classList.contains('active')) smoke.classList.add('active');
    if (sec >= 19.5 && !smoke.classList.contains('fade')) smoke.classList.add('fade');
    if (sec >= 21.0 && !ishi.classList.contains('active')) ishi.classList.add('active');
    if (sec >= 25.0 && !wakaba.classList.contains('active')) wakaba.classList.add('active');
    if (sec >= 28.0 && !confettiActive) {
      confettiActive = true;
      kinoko.classList.add('jump');
      initConfetti();
    }
    if (sec >= 44.0 && !curtain.classList.contains('fade-out')) {
      curtain.classList.add('fade-out');
    }
  });

  // 主題歌終了後、自動で通常カメラへ戻る
  audio.addEventListener('ended', () => {
    setTimeout(() => {
      returnToNormal();
    }, 1500);
  });

  function initConfetti() {
    particles = [];
    const colors = ['#ff8a80', '#ffd180', '#ffff8d', '#ccff90', '#a7ffeb', '#80d8ff', '#ea80fc'];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -10,
        r: Math.random() * 6 + 4,
        d: Math.random() * 2 + 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngle: 0,
        tiltAngleIncremental: (Math.random() * 0.07) + 0.05
      });
    }
    requestAnimationFrame(renderConfetti);
  }

  function renderConfetti() {
    if (!confettiActive) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.tiltAngle += p.tiltAngleIncremental;
      p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
      p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
      ctx.stroke();
      if (p.y > canvas.height) {
        particles[i].x = Math.random() * canvas.width;
        particles[i].y = -10;
      }
    }
    requestAnimationFrame(renderConfetti);
  }
</script>
</body>
</html>
