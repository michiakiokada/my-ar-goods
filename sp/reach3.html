<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小さな森の研究所 - スーパーリーチ（停電フリーズ）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-width: 1200px;
      max-height: 675px;
      overflow: hidden;
      background: #000;
    }
    #bg {
      position: absolute; width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.0);
      transition: filter 0.3s, transform 15s ease-out;
    }
    #stage.sp-playing #bg { transform: scale(1.08); }

    #blackout-curtain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 50; opacity: 0; pointer-events: none;
    }
    #blackout-curtain.active { opacity: 1; }

    #red-alert {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255,0,0,0.4) 0%, rgba(255,0,0,0.85) 100%);
      z-index: 55; opacity: 0; pointer-events: none; mix-blend-mode: screen;
    }
    .siren-blink { animation: alert-flash 1.2s infinite ease-in-out; }
    @keyframes alert-flash {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.95; }
    }

    #glow-kinoko {
      position: absolute; bottom: 8%; left: 50%;
      transform: translateX(-50%) scale(0.9);
      height: 65%; z-index: 60; opacity: 0;
      filter: drop-shadow(0 0 35px #ff00ff) drop-shadow(0 0 70px #a100ff) brightness(1.2);
      transition: opacity 1.2s ease-in, transform 6s ease-out;
    }
    #glow-kinoko.show { opacity: 1; transform: translateX(-50%) scale(1.05); }

    #terminal-ui {
      position: absolute; top: 12%; left: 50%;
      transform: translateX(-50%); width: 85%;
      text-align: center; z-index: 70;
      color: #ff3333; text-shadow: 0 0 15px #ff0000;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    #terminal-title {
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 900; letter-spacing: 3px; margin-bottom: 10px;
    }
    #terminal-sub {
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 2px; color: #ff9999;
    }

    #gauge-box {
      width: 70%; height: 20px;
      background: rgba(50,0,0,0.8);
      border: 2px solid #ff0000; border-radius: 12px;
      margin: 20px auto 0; overflow: hidden; padding: 2px;
    }
    #gauge-bar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff00ff, #ffffff);
      border-radius: 8px; box-shadow: 0 0 20px #ff0055;
      transition: width 4.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    #spark-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; z-index: 80; opacity: 0; pointer-events: none;
    }
    .sparks { animation: spark-flash 0.4s infinite; }
    @keyframes spark-flash {
      0%, 40% { opacity: 0.1; }
      20%, 60%, 100% { opacity: 0.95; }
    }

    #kinoko {
      position: absolute; bottom: 5%; left: 50%;
      transform: translateX(-50%) scale(0);
      height: 60%; z-index: 20; transform-origin: bottom center;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
      transition: transform 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    #kinoko.show { transform: translateX(-50%) scale(1.0); }
    .dance-kinoko {
      animation: kinoko-sway 0.8s ease-in-out infinite alternate,
                 kinoko-breathe 1.6s ease-in-out infinite alternate !important;
    }
    @keyframes kinoko-sway {
      0% { transform: translateX(-50%) rotate(-3deg); }
      100% { transform: translateX(-50%) rotate(3deg); }
    }
    @keyframes kinoko-breathe {
      0% { transform: translateX(-50%) scale(1.0, 1.0); }
      100% { transform: translateX(-50%) scale(1.03, 0.98); }
    }
    .jump { animation: jump-anim 0.4s ease-in-out infinite alternate !important; }
    @keyframes jump-anim {
      0% { transform: translateX(-50%) translateY(0); }
      100% { transform: translateX(-50%) translateY(-25px); }
    }

    #smoke {
      position: absolute; top: -20%; left: 50%;
      transform: translateX(-50%) scale(0);
      width: 80%; z-index: 25; opacity: 0; pointer-events: none;
      transition: all 1.2s cubic-bezier(0.1, 0.8, 0.3, 1);
    }
    #smoke.active { transform: translateX(-50%) scale(1.3); opacity: 0.95; }
    #smoke.fade { opacity: 0; transform: translateX(-50%) scale(1.6) translateY(-50px); transition: all 2.5s ease-out; }

    #ishi {
      position: absolute; bottom: 5%; left: -35%;
      height: 42%; z-index: 22; transform-origin: bottom center;
      transition: left 1.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }
    #ishi.active { left: 12%; animation: ishi-bounce 0.8s ease-in-out infinite alternate; }
    @keyframes ishi-bounce {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }

    #wakaba {
      position: absolute; bottom: 5%; right: -35%;
      height: 52%; z-index: 22; transform-origin: bottom center;
      transition: right 1.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }
    #wakaba.active { right: 12%; animation: wakaba-sway 0.8s ease-in-out infinite alternate; }
    @keyframes wakaba-sway {
      0% { transform: translateY(0) rotate(3deg); }
      100% { transform: translateY(-12px) rotate(-3deg); }
    }

    #confetti { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }
    #curtain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #curtain.blackout { opacity: 0.94; }
    #curtain.fade-out { opacity: 1; transition: opacity 3s ease-in-out; }

    #result-banner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      color: #fff;
      font-size: clamp(24px, 4.5vw, 42px);
      font-weight: bold;
      z-index: 150; opacity: 0;
      transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      text-shadow: 0 0 25px rgba(255,215,0,0.9), 0 4px 15px #000;
      text-align: center;
      width: 90%;
      line-height: 1.4;
    }
    #result-banner.show { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }

    #tap-to-start {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 200; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.4); color: #fff; font-size: 18px; font-weight: bold;
    }
  </style>
</head>
<body>

<div id="stage">
  <img id="bg" src="sp_bg.png" alt="背景">

  <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
    <img id="smoke" src="sp_smoke.png" alt="毒の煙">
    <img id="kinoko" src="sp_kinoko.png" alt="毒キノコちゃん">
  </div>
  <img id="ishi" src="sp_ishi.png" alt="石ちゃん">
  <img id="wakaba" src="sp_wakaba.png" alt="若葉ちゃん">

  <div id="blackout-curtain"></div>
  <div id="red-alert"></div>
  <img id="glow-kinoko" src="sp_kinoko.png" alt="発光キノコ">
  <div id="terminal-ui">
    <div id="terminal-title">⚠ WARNING: 異常エネルギー検知 ⚠</div>
    <div id="terminal-sub">覚醒シークエンス起動中……</div>
    <div id="gauge-box"><div id="gauge-bar"></div></div>
  </div>
  <div id="spark-screen"></div>

  <canvas id="confetti"></canvas>
  <div id="curtain"></div>
  <div id="result-banner"></div>

  <div id="tap-to-start" onclick="initStart()">
    <span>画面をタップして観測開始</span>
  </div>
</div>

<audio id="audio" src="theme.mp3" preload="auto"></audio>

<script>
  const stage = document.getElementById('stage');
  const curtain = document.getElementById('curtain');
  const resultBanner = document.getElementById('result-banner');
  const audio = document.getElementById('audio');
  const kinoko = document.getElementById('kinoko');
  const smoke = document.getElementById('smoke');
  const ishi = document.getElementById('ishi');
  const wakaba = document.getElementById('wakaba');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const tapOverlay = document.getElementById('tap-to-start');

  const blackout = document.getElementById('blackout-curtain');
  const redAlert = document.getElementById('red-alert');
  const glowKinoko = document.getElementById('glow-kinoko');
  const terminalUi = document.getElementById('terminal-ui');
  const gaugeBar = document.getElementById('gauge-bar');
  const sparkScreen = document.getElementById('spark-screen');

  let isPlaying = false;
  let confettiActive = false;
  let particles = [];
  let sirenInterval = null;

  function resizeCanvas() {
    canvas.width = stage.clientWidth;
    canvas.height = stage.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playPuchunSE() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playSirenSE() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.6);
    osc.frequency.linearRampToValueAtTime(500, audioCtx.currentTime + 1.2);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.2);
  }

  function returnToNormal() {
    curtain.classList.add('fade-out');
    setTimeout(() => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '../index.html';
      }
    }, 1500);
  }

  function initStart() {
    if (isPlaying) return;
    tapOverlay.style.display = 'none';
    if (audioCtx.state === 'suspended') audioCtx.resume();
    startFreezeReach();
  }

  // 停電フリーズ演出（約10.5秒）
  function startFreezeReach() {
    isPlaying = true;

    playPuchunSE();
    blackout.classList.add('active');

    setTimeout(() => {
      redAlert.classList.add('siren-blink');
      playSirenSE();
      sirenInterval = setInterval(playSirenSE, 1200);
    }, 1500);

    setTimeout(() => {
      glowKinoko.classList.add('show');
    }, 2800);

    setTimeout(() => {
      terminalUi.style.opacity = '1';
      gaugeBar.style.width = '100%';
    }, 4200);

    setTimeout(() => {
      clearInterval(sirenInterval);
      sparkScreen.classList.add('sparks');
    }, 8800);

    setTimeout(() => {
      sparkScreen.classList.remove('sparks');
      redAlert.className = '';
      glowKinoko.classList.remove('show');
      terminalUi.style.opacity = '0';
      judgeResult();
    }, 9800);
  }

  function judgeResult() {
    curtain.classList.add('blackout');

    setTimeout(() => {
      const isWin = (Math.random() < 0.25);

      if (isWin) {
        resultBanner.innerHTML = '⚡ 電 源 復 旧 ⚡<br><span style="font-size: 1.25em; color: #ffd700;">🎉 大 当 た り 🎉</span>';
        resultBanner.classList.add('show');
        audio.play();

        setTimeout(() => {
          resultBanner.classList.remove('show');
          curtain.classList.remove('blackout');
          blackout.classList.remove('active');
          startSpecialLivePerformance();
        }, 1800);

      } else {
        resultBanner.innerHTML = '【 電 源 復 旧 】<br><span style="font-size: 0.85em; color: #90a4ae;">……異常なし（通常へ）</span>';
        resultBanner.classList.add('show');

        setTimeout(() => {
          returnToNormal();
        }, 2200);
      }
    }, 1200);
  }

  function startSpecialLivePerformance() {
    stage.classList.add('sp-playing');
    kinoko.classList.add('show', 'dance-kinoko');
  }

  audio.addEventListener('timeupdate', () => {
    const sec = audio.currentTime;
    if (sec >= 17.0 && !smoke.classList.contains('active')) smoke.classList.add('active');
    if (sec >= 19.5 && !smoke.classList.contains('fade')) smoke.classList.add('fade');
    if (sec >= 21.0 && !ishi.classList.contains('active')) ishi.classList.add('active');
    if (sec >= 25.0 && !wakaba.classList.contains('active')) wakaba.classList.add('active');
    if (sec >= 28.0 && !confettiActive) {
      confettiActive = true;
      kinoko.classList.add('jump');
      initConfetti();
    }
    if (sec >= 44.0 && !curtain.classList.contains('fade-out')) {
      curtain.classList.add('fade-out');
    }
  });

  audio.addEventListener('ended', () => {
    setTimeout(() => {
      returnToNormal();
    }, 1500);
  });

  function initConfetti() {
    particles = [];
    const colors = ['#ff8a80', '#ffd180', '#ffff8d', '#ccff90', '#a7ffeb', '#80d8ff', '#ea80fc'];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -10,
        r: Math.random() * 6 + 4,
        d: Math.random() * 2 + 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngle: 0,
        tiltAngleIncremental: (Math.random() * 0.07) + 0.05
      });
    }
    requestAnimationFrame(renderConfetti);
  }

  function renderConfetti() {
    if (!confettiActive) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.tiltAngle += p.tiltAngleIncremental;
      p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
      p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
      ctx.stroke();
      if (p.y > canvas.height) {
        particles[i].x = Math.random() * canvas.width;
        particles[i].y = -10;
      }
    }
    requestAnimationFrame(renderConfetti);
  }
</script>
</body>
</html>
