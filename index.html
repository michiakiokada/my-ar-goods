<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小さな森の研究所 - 生態観測レンズ</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; user-select: none; }

    /* 観測スコープ枠 */
    .scope-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 500; }
    .corner { position: absolute; width: 28px; height: 28px; border: 3px solid rgba(255, 255, 255, 0.7); }
    .top-left     { top: 20px; left: 20px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .top-right    { top: 20px; right: 20px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .bottom-left  { bottom: 20px; left: 20px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* 上部ステータスヘッダー */
    .lab-header {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(28, 42, 25, 0.85); backdrop-filter: blur(6px);
      border: 1.5px solid rgba(180, 220, 160, 0.45);
      padding: 6px 14px; border-radius: 25px;
      display: flex; align-items: center; gap: 10px; z-index: 600; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .header-logo-img {
      height: 24px; width: auto; max-width: 130px; object-fit: contain; display: none;
    }
    .header-logo-text {
      font-size: 12px; font-weight: bold; color: #55efc4; display: inline-block;
    }
    .status-group {
      display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #e8f5e9;
      border-left: 1px solid rgba(255,255,255,0.25); padding-left: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffcc00; }
    .status-dot.active { background: #55efc4; box-shadow: 0 0 8px #55efc4; }
    .status-dot.collabo { background: #ff7675; box-shadow: 0 0 10px #ff7675; }

    /* 下部UI */
    #ui-container {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; flex-direction: column; align-items: center;
      gap: 10px; width: 90%; max-width: 420px; pointer-events: none;
    }

    #dialog-panel {
      background: rgba(255, 255, 255, 0.96); border: 3px solid #ff7b90;
      padding: 12px 18px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      width: 100%; text-align: center; transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #dialog-panel.panel-hidden { opacity: 0; transform: scale(0.94); }

    #speech-text { color: #3e2714; font-size: 15px; font-weight: bold; line-height: 1.45; white-space: pre-wrap; }
    #observation-log { margin-top: 6px; font-size: 11px; color: #7b8a70; border-top: 1px dashed #e0d0c0; padding-top: 5px; }

    /* 操作ボタングループ */
    .button-group {
      display: flex; gap: 10px; width: 100%; justify-content: center; pointer-events: auto;
    }

    #capture-btn {
      appearance: none; border: none; cursor: pointer;
      background: linear-gradient(135deg, #ff7b90 0%, #ee5253 100%);
      color: #ffffff; font-size: 13.5px; font-weight: bold; font-family: inherit;
      padding: 10px 18px; border-radius: 25px; box-shadow: 0 4px 14px rgba(238, 82, 83, 0.35);
      display: flex; align-items: center; gap: 6px; transition: transform 0.1s ease;
    }
    #capture-btn:active { transform: scale(0.95); }

    #shop-btn {
      background: linear-gradient(135deg, #48bb78 0%, #2f855a 100%);
      color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: bold;
      padding: 10px 18px; border-radius: 25px; box-shadow: 0 4px 14px rgba(47, 133, 90, 0.35);
      display: flex; align-items: center; justify-content: center;
    }

    /* 撮影フラッシュ演出 */
    #shutter-flash {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #ffffff; opacity: 0; pointer-events: none; z-index: 2000;
      transition: opacity 0.08s ease-out;
    }
    #shutter-flash.flashing { opacity: 0.85; }

    /* スクリーンショット プレビューモーダル */
    #preview-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(20, 30, 20, 0.85); backdrop-filter: blur(6px);
      z-index: 3000; display: none; flex-direction: column;
      align-items: center; justify-content: center; padding: 16px;
    }
    #preview-modal.active { display: flex; }

    .modal-card {
      background: #ffffff; border-radius: 22px; padding: 16px;
      width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    #preview-img {
      max-width: 100%; max-height: 40vh; border-radius: 12px;
      border: 2px solid #e0e8dc; object-fit: contain;
    }

    /* SNS用テキスト表示ボックス */
    .sns-box {
      width: 100%; background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 12px; padding: 10px 12px; margin-top: 10px;
      text-align: left;
    }
    .sns-title { font-size: 11px; font-weight: bold; color: #15803d; margin-bottom: 4px; }
    #sns-text-preview {
      font-size: 11.5px; color: #374151; line-height: 1.4; white-space: pre-wrap;
      user-select: text; background: #ffffff; padding: 6px 8px; border-radius: 6px;
      border: 1px solid #dcfce7; max-height: 70px; overflow-y: auto;
    }

    .modal-actions {
      margin-top: 12px; display: flex; flex-direction: column; gap: 8px; width: 100%;
    }
    .btn-row { display: flex; gap: 8px; width: 100%; }

    .modal-btn {
      flex: 1; padding: 9px 12px; border-radius: 20px; font-size: 12.5px; font-weight: bold;
      cursor: pointer; border: none; font-family: inherit; display: flex; align-items: center;
      justify-content: center; gap: 4px; transition: opacity 0.15s;
    }
    .modal-btn:active { opacity: 0.8; }
    .btn-save  { background: #48bb78; color: white; }
    .btn-copy  { background: #10b981; color: white; }
    .btn-x     { background: #000000; color: white; }
    .btn-close { background: #dfe6e9; color: #2d3436; }
  </style>
</head>
<body>

  <!-- シャッターフラッシュ -->
  <div id="shutter-flash"></div>

  <div class="scope-overlay">
    <div class="corner top-left"></div><div class="corner top-right"></div>
    <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
  </div>

  <!-- 画面上部ヘッダー（画像読み込み失敗時は自動で文字ロゴに切り替わります） -->
  <div class="lab-header">
    <img id="headerLogoImg" class="header-logo-img" alt="ロゴ">
    <span id="headerLogoText" class="header-logo-text">🌿 小さな森の研究所</span>
    <div class="status-group">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">スキャン中</span>
    </div>
  </div>

  <div id="ui-container">
    <div id="dialog-panel">
      <div id="speech-text">小さな森のともだちを探してね…🌱</div>
      <div id="observation-log">【観測待機】グッズやカードにレンズをかざしてください</div>
    </div>
    <div class="button-group">
      <button id="capture-btn" type="button">📷 観測記録を撮る</button>
      <a id="shop-btn" href="https://chiisanamori.shop" target="_blank" rel="noopener noreferrer">
        🌿 研究所へ行く ➔
      </a>
    </div>
  </div>

  <!-- プレビューモーダル -->
  <div id="preview-modal">
    <div class="modal-card">
      <img id="preview-img" alt="観測記録プレビュー">
      
      <!-- SNS投稿用テキストエリア -->
      <div class="sns-box">
        <div class="sns-title">🌿 SNS投稿用テキスト（ハッシュタグ付き）</div>
        <div id="sns-text-preview"></div>
      </div>

      <div class="modal-actions">
        <div class="btn-row">
          <button id="save-share-btn" class="modal-btn btn-save" type="button">💾 画像保存/共有</button>
          <button id="copy-sns-btn" class="modal-btn btn-copy" type="button">📋 文言コピー</button>
        </div>
        <div class="btn-row">
          <button id="tweet-btn" class="modal-btn btn-x" type="button">𝕏 でポスト</button>
          <button id="close-modal-btn" class="modal-btn btn-close" type="button">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <!-- maxTrack: 4 (同時に認識できる最大枚数) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4; autoStart: true; uiLoading: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

    <!-- 0〜8番のターゲットアンカー -->
    <a-entity id="anchor-0" mindar-image-target="targetIndex: 0"><a-entity id="root-0" position="0 0 0.05"><a-plane id="plane-0" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-1" mindar-image-target="targetIndex: 1"><a-entity id="root-1" position="0 0 0.05"><a-plane id="plane-1" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-2" mindar-image-target="targetIndex: 2"><a-entity id="root-2" position="0 0 0.05"><a-plane id="plane-2" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-3" mindar-image-target="targetIndex: 3"><a-entity id="root-3" position="0 0 0.05"><a-plane id="plane-3" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-4" mindar-image-target="targetIndex: 4"><a-entity id="root-4" position="0 0 0.05"><a-plane id="plane-4" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-5" mindar-image-target="targetIndex: 5"><a-entity id="root-5" position="0 0 0.05"><a-plane id="plane-5" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-6" mindar-image-target="targetIndex: 6"><a-entity id="root-6" position="0 0 0.05"><a-plane id="plane-6" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-7" mindar-image-target="targetIndex: 7"><a-entity id="root-7" position="0 0 0.05"><a-plane id="plane-7" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
    <a-entity id="anchor-8" mindar-image-target="targetIndex: 8"><a-entity id="root-8" position="0 0 0.05"><a-plane id="plane-8" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5" visible="false"></a-plane></a-entity></a-entity>
  </a-scene>

  <script>
    // ========================================================
    // ★【自由設定エリア】カード番号（0〜8）全9枚のキャラクター割り当て
    // ========================================================
    const TARGET_MAPPING = {
      0: "kinoko_talk",  // カード0: 毒キノコちゃん
      1: "kinoko_talk",  // カード1: 毒キノコちゃん
      2: "kinoko_talk",  // カード2: 毒キノコちゃん
      3: "ishi_talk",    // カード3: 石ちゃん
      4: "ishi_talk",    // カード4: 石ちゃん
      5: "ishi_talk",    // カード5: 石ちゃん
      6: "wakaba_talk",  // カード6: 若葉ちゃん
      7: "wakaba_talk",  // カード7: 若葉ちゃん
      8: "wakaba_talk",  // カード8: 若葉ちゃん
    };

    // 上記以外の未登録カードが出た場合の予備キャラクター
    const DEFAULT_CHARA = "kinoko_talk";

    // サイトロゴ画像のURL（同一フォルダに site-logo.png を置く場合は './site-logo.png' に変更可能）
    const SITE_LOGO_URL = 'https://fancy-bird-bd3c.tcrygrs.workers.dev/images/site-logo.png';

    // ========================================================
    // キャラクターの基本マスターデータ
    // ========================================================
    const CHARA_MASTER = {
      kinoko: {
        name: '毒キノコちゃん',
        csv: './kinoko_talk.csv',
        scenarios: [],
        currentImg: '',
        state: { currentX: 0, currentY: 0, targetX: 0, targetY: 0, facingX: 1, action: 'talk', animTimer: 0 }
      },
      ishi: {
        name: '石ちゃん',
        csv: './ishi_talk.csv',
        scenarios: [],
        currentImg: '',
        state: { currentX: 0, currentY: 0, targetX: 0, targetY: 0, facingX: 1, action: 'talk', animTimer: 1.5 }
      },
      wakaba: {
        name: '若葉ちゃん',
        csv: './wakaba_talk.csv',
        scenarios: [],
        currentImg: '',
        state: { currentX: 0, currentY: 0, targetX: 0, targetY: 0, facingX: 1, action: 'talk', animTimer: 3.0 }
      }
    };

    const COLLABO_CSV = './collabo_talk.csv';
    let collaboScenarios = [];

    const CONFIG = {
      areaRangeX: 1.5,
      areaRangeY: 1.3,
      msgDurationMin: 6500,
      msgDurationMax: 8500
    };

    function getCharaKey(targetId) {
      const raw = TARGET_MAPPING[targetId] || DEFAULT_CHARA;
      return raw.replace('_talk', '').trim();
    }

    const visibleTargetIds = new Set();

    // DOM要素
    const dialogPanel = document.getElementById('dialog-panel');
    const speechText = document.getElementById('speech-text');
    const observationLog = document.getElementById('observation-log');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const headerLogoImg = document.getElementById('headerLogoImg');
    const headerLogoText = document.getElementById('headerLogoText');
    let lastTime = performance.now();

    // ★ ロゴ画像の読み込み監視（破損時の×印を完全防止）
    let isLogoImageLoaded = false;
    headerLogoImg.crossOrigin = 'anonymous';
    headerLogoImg.onload = () => {
      isLogoImageLoaded = true;
      headerLogoImg.style.display = 'block';
      headerLogoText.style.display = 'none';
    };
    headerLogoImg.onerror = () => {
      isLogoImageLoaded = false;
      headerLogoImg.style.display = 'none';
      headerLogoText.style.display = 'inline-block';
    };
    headerLogoImg.src = SITE_LOGO_URL;

    // 全プレーンにショップクリックを設定
    for (let i = 0; i < 9; i++) {
      const p = document.getElementById(`plane-${i}`);
      if (p) p.addEventListener('click', () => window.open('https://chiisanamori.shop', '_blank'));
    }

    // === ① CSV読み込み ===
    async function fetchCSV(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) return [];
        const text = await res.text();
        const rows = text.trim().split('\n').map(r => r.split(','));
        return rows.slice(1).map(cols => ({
          condition: cols[0]?.trim(),
          image: cols[1]?.trim(),
          action: cols[2]?.trim(),
          speech: cols[3]?.trim(),
          log: cols[4]?.trim()
        })).filter(item => item.speech);
      } catch (e) {
        return [];
      }
    }

    async function loadAllCSVs() {
      for (const key of Object.keys(CHARA_MASTER)) {
        CHARA_MASTER[key].scenarios = await fetchCSV(CHARA_MASTER[key].csv);
      }
      collaboScenarios = await fetchCSV(COLLABO_CSV);
    }

    // === ② 時間・環境判定 ===
    function getActiveConditions() {
      const now = new Date();
      const hour = now.getHours();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const conditions = ['ALL'];

      if (hour >= 5 && hour < 11) conditions.push('朝');
      else if (hour >= 11 && hour < 17) conditions.push('昼');
      else conditions.push('夜');

      if (month === 12 || month <= 2) conditions.push('寒');
      if (month >= 7 && month <= 8) conditions.push('暑');

      if (month === 12 && date >= 18 && date <= 24) conditions.push('XMAS_PRE');
      if (month === 12 && date === 25) conditions.push('XMAS');

      return conditions;
    }

    function updatePanel(speech, log) {
      dialogPanel.classList.add('panel-hidden');
      setTimeout(() => {
        speechText.innerText = speech;
        observationLog.innerText = log;
        dialogPanel.classList.remove('panel-hidden');
      }, 400);
    }

    // === ③ 認識イベントの監視（0〜8） ===
    for (let i = 0; i < 9; i++) {
      const anchorEl = document.getElementById(`anchor-${i}`);
      if (!anchorEl) continue;

      anchorEl.addEventListener("targetFound", () => {
        visibleTargetIds.add(i);
        syncDisplayedCharacters();
      });

      anchorEl.addEventListener("targetLost", () => {
        visibleTargetIds.delete(i);
        syncDisplayedCharacters();
      });
    }

    function getActiveCharacters() {
      const activeMap = new Map();
      visibleTargetIds.forEach(targetId => {
        const charaKey = getCharaKey(targetId);
        if (!activeMap.has(charaKey) && CHARA_MASTER[charaKey]) {
          activeMap.set(charaKey, targetId);
        }
      });

      const list = [];
      activeMap.forEach((targetId, charaKey) => {
        list.push({ charaKey, targetId, data: CHARA_MASTER[charaKey] });
      });
      return list;
    }

    function syncDisplayedCharacters() {
      const activeCharas = getActiveCharacters();
      const activeTargetIds = new Set(activeCharas.map(a => a.targetId));

      for (let i = 0; i < 9; i++) {
        const plane = document.getElementById(`plane-${i}`);
        if (plane) {
          plane.setAttribute('visible', activeTargetIds.has(i));
        }
      }

      statusDot.classList.remove('active', 'collabo');

      if (activeCharas.length === 3) {
        statusDot.classList.add('collabo');
        statusText.innerText = "3人あつまったよ！🎉";
      } else if (activeCharas.length > 0) {
        statusDot.classList.add('active');
        const names = activeCharas.map(a => a.data.name).join('と');
        statusText.innerText = `${names}を観測中！`;
      } else {
        statusText.innerText = "スキャン中";
        updatePanel("小さな森のともだちを探してね…🌱", "【観測待機】グッズやカードにレンズをかざしてください");
      }
    }

    // === ④ シナリオ抽選 ===
    function nextScenario() {
      const activeCharas = getActiveCharacters();

      if (activeCharas.length === 0) {
        setTimeout(nextScenario, 1000);
        return;
      }

      const activeConditions = getActiveConditions();

      if (activeCharas.length === 3 && collaboScenarios.length > 0) {
        const available = collaboScenarios.filter(item => activeConditions.includes(item.condition));
        const chosen = (available.length > 0 ? available : collaboScenarios)[Math.floor(Math.random() * (available.length || collaboScenarios.length))];
        updatePanel(chosen.speech, `【3人なかよしログ】${chosen.log}`);
      } else {
        const chosenActive = activeCharas[Math.floor(Math.random() * activeCharas.length)];
        const chara = chosenActive.data;
        const state = chara.state;
        const plane = document.getElementById(`plane-${chosenActive.targetId}`);

        const list = chara.scenarios.length > 0 ? chara.scenarios : CHARA_MASTER.kinoko.scenarios;

        if (list.length > 0) {
          const available = list.filter(item => activeConditions.includes(item.condition));
          const chosen = (available.length > 0 ? available : list)[Math.floor(Math.random() * (available.length || list.length))];

          state.action = chosen.action;
          chara.currentImg = chosen.image;

          if (plane && chosen.image) plane.setAttribute('src', chosen.image);

          if (state.action === 'explore') {
            state.targetX = (Math.random() - 0.5) * CONFIG.areaRangeX;
            state.targetY = 0.2 + Math.random() * 0.4;
          } else if (state.action === 'walk') {
            state.targetX = (Math.random() - 0.5) * CONFIG.areaRangeX;
            state.targetY = (Math.random() - 0.5) * CONFIG.areaRangeY;
          } else {
            state.targetX = state.currentX;
            state.targetY = state.currentY;
          }

          updatePanel(chosen.speech, `【生態ログ】${chosen.log}`);
        }
      }

      const delay = CONFIG.msgDurationMin + Math.random() * (CONFIG.msgDurationMax - CONFIG.msgDurationMin);
      setTimeout(nextScenario, delay);
    }

    // === ⑤ アニメーションループ ===
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const activeCharas = getActiveCharacters();

      activeCharas.forEach(({ charaKey, targetId, data }) => {
        const state = data.state;
        const plane = document.getElementById(`plane-${targetId}`);
        const root = document.getElementById(`root-${targetId}`);
        if (!plane || !root) return;

        if (data.currentImg && plane.getAttribute('src') !== data.currentImg) {
          plane.setAttribute('src', data.currentImg);
        }

        let speed = 0;
        if (state.action === 'walk') speed = 0.20;
        if (state.action === 'explore') speed = 0.35;

        const dx = state.targetX - state.currentX;
        const dy = state.targetY - state.currentY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0.05 && speed > 0) {
          const step = Math.min(speed * dt, dist);
          state.currentX += (dx / dist) * step;
          state.currentY += (dy / dist) * step;
          if (Math.abs(dx) > 0.03) state.facingX = dx > 0 ? 1 : -1;
        }

        state.animTimer += dt;
        let bounceZ = 0.05;
        let tiltRot = 0;

        if (state.action === 'sleep') {
          bounceZ += Math.sin(state.animTimer * 1.5) * 0.005;
        } else if (state.action === 'jump') {
          bounceZ += Math.abs(Math.sin(state.animTimer * 4.0)) * 0.10;
        } else if (state.action === 'explore' || state.action === 'walk') {
          bounceZ += Math.abs(Math.sin(state.animTimer * 5.0)) * 0.015;
          tiltRot = Math.sin(state.animTimer * 5.0) * 2.0;
        } else {
          bounceZ += Math.sin(state.animTimer * 2.0) * 0.008;
        }

        plane.setAttribute('scale', `${state.facingX} 1 1`);
        root.setAttribute('rotation', `0 0 ${tiltRot}`);
        root.setAttribute('position', `${state.currentX} ${state.currentY} ${bounceZ}`);
      });

      requestAnimationFrame(loop);
    }

    // ========================================================
    // ★ スクリーンショット撮影＆保存・SNSシェア機能
    // ========================================================
    let capturedBlob = null;
    let capturedDataUrl = '';
    let currentSnsText = '';

    const shutterFlash = document.getElementById('shutter-flash');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const snsTextPreview = document.getElementById('sns-text-preview');
    const captureBtn = document.getElementById('capture-btn');
    const saveShareBtn = document.getElementById('save-share-btn');
    const copySnsBtn = document.getElementById('copy-sns-btn');
    const tweetBtn = document.getElementById('tweet-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');

    function drawRoundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, width, height, radius);
      } else {
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }
    }

    async function takeScreenshot() {
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('video');

      if (!video || !sceneEl) {
        alert('カメラの準備中です。少々お待ちください。');
        return;
      }

      // ① シャッターフラッシュ演出
      shutterFlash.classList.add('flashing');
      setTimeout(() => shutterFlash.classList.remove('flashing'), 150);

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      // ② A-Frame公式 screenshot コンポーネントでARキャラを取得
      let arCanvas = null;
      try {
        if (sceneEl.components && sceneEl.components.screenshot) {
          sceneEl.setAttribute('screenshot', {
            width: Math.round(screenW * dpr),
            height: Math.round(screenH * dpr)
          });
          arCanvas = sceneEl.components.screenshot.getCanvas('perspective');
        }
      } catch (e) {
        console.warn('A-Frame screenshot fallback:', e);
      }

      // ③ 合成用キャンバス作成
      const outputCanvas = document.createElement('canvas');
      outputCanvas.width = screenW * dpr;
      outputCanvas.height = screenH * dpr;
      const ctx = outputCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      // ④ カメラ背景（video）を描画
      const vRect = video.getBoundingClientRect();
      if (vRect && vRect.width > 0 && vRect.height > 0) {
        ctx.drawImage(video, vRect.left, vRect.top, vRect.width, vRect.height);
      } else {
        const vWidth = video.videoWidth || screenW;
        const vHeight = video.videoHeight || screenH;
        const vRatio = vWidth / vHeight;
        const cRatio = screenW / screenH;
        let sx = 0, sy = 0, sw = vWidth, sh = vHeight;
        if (vRatio > cRatio) {
          sw = vHeight * cRatio;
          sx = (vWidth - sw) / 2;
        } else {
          sh = vWidth / cRatio;
          sy = (vHeight - sh) / 2;
        }
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, screenW, screenH);
      }

      // ⑤ ARキャラクターを描画
      if (arCanvas) {
        ctx.drawImage(arCanvas, 0, 0, screenW, screenH);
      } else if (sceneEl.canvas) {
        ctx.drawImage(sceneEl.canvas, 0, 0, screenW, screenH);
      }

      // ⑥ ★ サイトロゴ合成（画像があれば画像、なければ文字プレートを100%合成）
      if (isLogoImageLoaded && headerLogoImg && headerLogoImg.naturalWidth > 0) {
        ctx.save();
        const logoTargetW = Math.min(screenW * 0.42, 150);
        const logoAspect = headerLogoImg.naturalHeight / headerLogoImg.naturalWidth;
        const logoTargetH = logoTargetW * logoAspect;
        const logoX = (screenW - logoTargetW) / 2;
        const logoY = 22;

        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;

        ctx.drawImage(headerLogoImg, logoX, logoY, logoTargetW, logoTargetH);
        ctx.restore();
      } else {
        // 画像未読込時のフォールバックロゴプレート
        ctx.save();
        const logoBoxW = 190;
        const logoBoxH = 36;
        const logoBoxX = (screenW - logoBoxW) / 2;
        const logoBoxY = 22;

        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.fillStyle = 'rgba(25, 42, 25, 0.88)';
        drawRoundRect(ctx, logoBoxX, logoBoxY, logoBoxW, logoBoxH, 18);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(180, 230, 160, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = "bold 13px 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif";
        ctx.fillStyle = '#55efc4';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🌿 小さな森の研究所', screenW / 2, logoBoxY + logoBoxH / 2);
        ctx.restore();
      }

      // ⑦ キャラクターのセリフ（コメント枠＆生態ログ）の合成
      const speech = speechText ? speechText.innerText : '';
      const log = observationLog ? observationLog.innerText : '';

      if (speech || log) {
        ctx.save();
        const pWidth = Math.min(screenW * 0.90, 420);
        const pX = (screenW - pWidth) / 2;
        const paddingX = 18;
        const maxContentW = pWidth - paddingX * 2;

        ctx.font = "bold 15px 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif";
        const speechLineHeight = 22;
        const speechLines = [];
        speech.split('\n').forEach(para => {
          let line = '';
          for (let char of para) {
            if (ctx.measureText(line + char).width > maxContentW) {
              speechLines.push(line);
              line = char;
            } else {
              line += char;
            }
          }
          if (line) speechLines.push(line);
        });

        ctx.font = "11px 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif";
        const logLineHeight = 16;
        const logLines = [];
        if (log) {
          log.split('\n').forEach(para => {
            let line = '';
            for (let char of para) {
              if (ctx.measureText(line + char).width > maxContentW) {
                logLines.push(line);
                line = char;
              } else {
                line += char;
              }
            }
            if (line) logLines.push(line);
          });
        }

        const speechTotalH = speechLines.length * speechLineHeight;
        const logTotalH = log ? (logLines.length * logLineHeight + 12) : 0;
        const pHeight = 14 + speechTotalH + logTotalH + 14;
        const pY = screenH - pHeight - 38;

        // 白い角丸パネル＋ドロップシャドウ
        ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 6;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
        drawRoundRect(ctx, pX, pY, pWidth, pHeight, 20);
        ctx.fill();

        // ピンクの枠線
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#ff7b90';
        ctx.lineWidth = 3;
        ctx.stroke();

        // セリフ描画
        ctx.font = "bold 15px 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif";
        ctx.fillStyle = '#3e2714';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        let textY = pY + 14;
        speechLines.forEach(line => {
          ctx.fillText(line, pX + pWidth / 2, textY);
          textY += speechLineHeight;
        });

        // 点線区切り ＆ ログ描画
        if (log) {
          textY += 4;
          ctx.save();
          ctx.strokeStyle = '#e0d0c0';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(pX + paddingX, textY);
          ctx.lineTo(pX + pWidth - paddingX, textY);
          ctx.stroke();
          ctx.restore();

          textY += 7;
          ctx.font = "11px 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif";
          ctx.fillStyle = '#7b8a70';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          logLines.forEach(line => {
            ctx.fillText(line, pX + pWidth / 2, textY);
            textY += logLineHeight;
          });
        }

        // コメント枠の真下にハッシュタグ＆サイトURLを刻印
        ctx.font = "bold 10px 'Hiragino Maru Gothic ProN', sans-serif";
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowBlur = 4;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('#小さな森の研究所   chiisanamori.shop', screenW / 2, pY + pHeight + 8);

        ctx.restore();
      }

      // ⑧ SNS用の投稿テキストを自動生成
      const activeCharas = getActiveCharacters();
      let charaName = '小さな森のともだち';
      if (activeCharas.length === 3) {
        charaName = '3人なかよしのみんな';
      } else if (activeCharas.length > 0) {
        charaName = activeCharas.map(a => a.data.name).join('と');
      }

      const cleanSpeech = speech ? speech.replace(/\n+/g, ' ') : '';
      currentSnsText = `小さな森の研究所で「${charaName}」を観測したよ！🌱\n「${cleanSpeech}」\n\n#小さな森の研究所 #生態観測レンズ #WebAR\nhttps://chiisanamori.shop`;

      // ⑨ 画像データ化 ＆ プレビューモーダル表示
      try {
        capturedDataUrl = outputCanvas.toDataURL('image/png');
        outputCanvas.toBlob(blob => {
          capturedBlob = blob;
        }, 'image/png');

        previewImg.src = capturedDataUrl;
        snsTextPreview.innerText = currentSnsText;
        previewModal.classList.add('active');
      } catch (err) {
        console.error('スクリーンショット生成エラー:', err);
        alert('画像の生成に失敗しました。');
      }
    }

    // 画像保存・共有アクション
    async function handleSaveOrShare() {
      const fileName = `chiisanamori_${Date.now()}.png`;

      if (navigator.share && capturedBlob) {
        try {
          const file = new File([capturedBlob], fileName, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: '小さな森の研究所 - 観測記録',
              text: currentSnsText
            });
            return;
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const a = document.createElement('a');
      a.href = capturedDataUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // SNS文言コピーアクション
    async function handleCopySns() {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(currentSnsText);
        } else {
          const ta = document.createElement('textarea');
          ta.value = currentSnsText;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copySnsBtn.innerText = '✅ コピー完了！';
        setTimeout(() => {
          copySnsBtn.innerText = '📋 文言コピー';
        }, 2000);
      } catch (e) {
        alert('コピーに失敗しました。テキスト枠から手動でコピーしてください。');
      }
    }

    // 𝕏 (Twitter) でポスト
    function handleTweet() {
      const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(currentSnsText)}`;
      window.open(tweetUrl, '_blank', 'noopener,noreferrer');
    }

    // イベント登録
    captureBtn.addEventListener('click', takeScreenshot);
    saveShareBtn.addEventListener('click', handleSaveOrShare);
    copySnsBtn.addEventListener('click', handleCopySns);
    tweetBtn.addEventListener('click', handleTweet);
    closeModalBtn.addEventListener('click', () => {
      previewModal.classList.remove('active');
    });

    // 起動
    loadAllCSVs().then(() => {
      nextScenario();
      requestAnimationFrame(loop);
    });
  </script>
