<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小さな森の WebAR</title>

  <!-- A-Frame と MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Hiragino Maru Gothic ProN', sans-serif;
    }

    /* 画面下部の案内バー */
    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      width: 90%;
      max-width: 400px;
    }

    /* メッセージ下部表示 */
    #msg-box {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #ff7b90;
      color: #4a2c11;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 100%;
      box-sizing: border-box;
      white-space: pre-wrap;
      transition: all 0.3s ease;
    }

    /* ショップへ行くボタン */
    #shop-btn {
      pointer-events: auto;
      background: #f65353;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(246, 83, 83, 0.4);
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- 下部メッセージ＆ショップリンクUI -->
  <div id="ui-container">
    <div id="msg-box">マーカーにカメラをかざしてね！🍄</div>
    <a id="shop-btn" href="https://chiisanamori.shop" target="_blank" rel="noopener noreferrer">
      小さな森の研究所へ行く ➔
    </a>
  </div>

  <!-- AR シーン（targets.mind を読み込み） -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- アセット管理 -->
    <a-assets>
      <img id="tex-front" src="chara_front.png">
      <img id="tex-back" src="chara_back.png">
    </a-assets>

    <!-- ARカメラ（クリック可能にするレイトレーサー付き） -->
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

    <!-- マーカー認識対象（targetIndex: 0） -->
    <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
      
      <!-- キャラクター親エンティティ（マーカー上を動く） -->
      <a-entity id="chara-root" position="0 0 0.05">
        
        <!-- 正面画像プレーン -->
        <a-plane id="plane-front" class="clickable" src="#tex-front" width="0.75" height="0.75" transparent="true" alpha-test="0.5" position="0 0 0" visible="true"></a-plane>
        
        <!-- 後ろ姿画像プレーン -->
        <a-plane id="plane-back" class="clickable" src="#tex-back" width="0.75" height="0.75" transparent="true" alpha-test="0.5" position="0 0 0" visible="false"></a-plane>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const anchor = document.getElementById('target-anchor');
    const charaRoot = document.getElementById('chara-root');
    const planeFront = document.getElementById('plane-front');
    const planeBack = document.getElementById('plane-back');
    const msgBox = document.getElementById('msg-box');

    // セリフパターン
    const messages = {
      walk: [
        "てくてく、お散歩日和〜♪",
        "わあ、今日の太陽さんは\nとってもあったかいね！",
        "らんらら〜ん♪"
      ],
      run: [
        "わーい！急げ急げ〜！",
        "走るの大すき！ついてきてね！",
        "風がとってもきもちいい！"
      ],
      jump: [
        "見つけてくれてありがとう！\nぴょんぴょん跳ねちゃう！",
        "わーい！大発見だよ！",
        "ちいさな森へ遊びにおいでよ！"
      ],
      idle: [
        "ちょっとひとやすみ…",
        "ちいさな森、見に行ってみる？\n下のボタンを押してね！",
        "次はどこへ探検にいこうかな？"
      ]
    };

    let isTargetFound = false;
    let posX = 0;
    let posY = 0;
    let targetX = 0;
    let targetY = 0;
    let currentState = 'idle';
    let jumpTime = 0;

    // マーカーを見つけた時
    anchor.addEventListener("targetFound", () => {
      isTargetFound = true;
      msgBox.innerText = "あっ、見つけてくれた！\nこんにちは〜！🍄";
    });

    // マーカーを見失った時
    anchor.addEventListener("targetLost", () => {
      isTargetFound = false;
      msgBox.innerText = "マーカーを探しているよ…\nカメラをかざしてね！";
    });

    // キャラクター自体をタップした時もショップへジャンプ
    [planeFront, planeBack].forEach(plane => {
      plane.addEventListener('click', () => {
        window.open('https://chiisanamori.shop', '_blank');
      });
    });

    // 行動パターンをランダムに切り替え
    function changeBehavior() {
      if (!isTargetFound) {
        setTimeout(changeBehavior, 1000);
        return;
      }

      const states = ['walk', 'run', 'jump', 'idle'];
      currentState = states[Math.floor(Math.random() * states.length)];

      // マーカーの枠内（-0.35 〜 +0.35 程度）を安全に動く
      targetX = (Math.random() - 0.5) * 0.7;
      targetY = (Math.random() - 0.5) * 0.7;

      // セリフ更新
      const list = messages[currentState];
      msgBox.innerText = list[Math.floor(Math.random() * list.length)];

      const nextTime = 2500 + Math.random() * 2500;
      setTimeout(changeBehavior, nextTime);
    }

    // 移動とアニメーションの毎フレーム処理
    function renderLoop() {
      if (isTargetFound) {
        let isMovingUp = false;
        let facingX = 1;

        if (currentState === 'walk' || currentState === 'run') {
          const speed = currentState === 'run' ? 0.012 : 0.005;
          const dx = targetX - posX;
          const dy = targetY - posY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist > 0.02) {
            posX += (dx / dist) * speed;
            posY += (dy / dist) * speed;
            facingX = dx > 0 ? 1 : -1;
            isMovingUp = dy > 0.002; // 上（奥）に進む時は後ろ姿
          }
        }

        // ジャンプ動作
        let posZ = 0.05;
        if (currentState === 'jump') {
          jumpTime += 0.15;
          posZ = 0.05 + Math.abs(Math.sin(jumpTime)) * 0.18;
        } else if (currentState === 'run') {
          jumpTime += 0.25;
          posZ = 0.05 + Math.abs(Math.sin(jumpTime)) * 0.06;
        }

        // 正面／後ろ姿の表示切り替え
        if (isMovingUp && (currentState === 'walk' || currentState === 'run')) {
          planeFront.setAttribute('visible', 'false');
          planeBack.setAttribute('visible', 'true');
        } else {
          planeFront.setAttribute('visible', 'true');
          planeBack.setAttribute('visible', 'false');
        }

        // 反転（進行方向）
        planeFront.setAttribute('scale', `${facingX} 1 1`);
        planeBack.setAttribute('scale', `${facingX} 1 1`);

        // 座標更新
        charaRoot.setAttribute('position', `${posX} ${posY} ${posZ}`);
      }

      requestAnimationFrame(renderLoop);
    }

    changeBehavior();
    renderLoop();
  </script>
</body>
</html>
