<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小さな森の研究所 - 生態観測レンズ</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; user-select: none; }

    /* 観測スコープ枠 */
    .scope-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 500; }
    .corner { position: absolute; width: 28px; height: 28px; border: 3px solid rgba(255, 255, 255, 0.7); }
    .top-left     { top: 20px; left: 20px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .top-right    { top: 20px; right: 20px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .bottom-left  { bottom: 20px; left: 20px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* 上部ステータス */
    .lab-header {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(35, 50, 30, 0.75); backdrop-filter: blur(4px);
      border: 1px solid rgba(180, 220, 160, 0.4); color: #e8f5e9;
      padding: 6px 16px; border-radius: 20px; font-size: 12px;
      display: flex; align-items: center; gap: 8px; z-index: 600;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffcc00; }
    .status-dot.active { background: #55efc4; box-shadow: 0 0 8px #55efc4; }

    /* 下部UI */
    #ui-container {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; flex-direction: column; align-items: center;
      gap: 10px; width: 90%; max-width: 420px; pointer-events: none;
    }

    #dialog-panel {
      background: rgba(255, 255, 255, 0.96); border: 3px solid #ff7b90;
      padding: 12px 18px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      width: 100%; text-align: center; transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #dialog-panel.panel-hidden { opacity: 0; transform: scale(0.94); }

    #speech-text { color: #3e2714; font-size: 15px; font-weight: bold; line-height: 1.45; white-space: pre-wrap; }
    #observation-log { margin-top: 6px; font-size: 11px; color: #7b8a70; border-top: 1px dashed #e0d0c0; padding-top: 5px; }

    #shop-btn {
      pointer-events: auto; background: linear-gradient(135deg, #48bb78 0%, #2f855a 100%);
      color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: bold;
      padding: 10px 24px; border-radius: 25px; box-shadow: 0 4px 14px rgba(47, 133, 90, 0.35);
    }
  </style>
</head>
<body>

  <div class="scope-overlay">
    <div class="corner top-left"></div><div class="corner top-right"></div>
    <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
  </div>

  <div class="lab-header">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">小さな森の研究所：スキャン中</span>
  </div>

  <div id="ui-container">
    <div id="dialog-panel">
      <div id="speech-text">小さな森のともだちを探してね…🌱</div>
      <div id="observation-log">【観測待機】グッズやカードにレンズをかざしてください</div>
    </div>
    <a id="shop-btn" href="https://chiisanamori.shop" target="_blank" rel="noopener noreferrer">
      🌿 小さな森の研究所へ行く ➔
    </a>
  </div>

  <a-scene 
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;" 
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

    <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
      <a-entity id="chara-root" position="0 0 0.05">
        <!-- 動的に画像を切り替えるプレーン -->
        <a-plane id="chara-plane" class="clickable" width="0.40" height="0.40" transparent="true" alpha-test="0.5"></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // 設定
    const CONFIG = {
      csvPath: './kinoko_talk.csv', // 読み込むCSVファイル名
      areaRangeX: 1.5,
      areaRangeY: 1.3,
      msgDurationMin: 6500,
      msgDurationMax: 8500
    };

    // DOM要素
    const anchor = document.getElementById('target-anchor');
    const charaRoot = document.getElementById('chara-root');
    const charaPlane = document.getElementById('chara-plane');
    const dialogPanel = document.getElementById('dialog-panel');
    const speechText = document.getElementById('speech-text');
    const observationLog = document.getElementById('observation-log');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    let scenarioList = [];
    let isTargetFound = false;
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;
    let facingX = 1;
    let currentAction = 'talk';
    let animTimer = 0;
    let lastTime = performance.now();

    // ショップへ飛ぶ
    charaPlane.addEventListener('click', () => {
      window.open('https://chiisanamori.shop', '_blank');
    });

    // === ① CSVファイルの読み込み ＆ 自動解析 ===
    async function loadCSV() {
      try {
        const response = await fetch(CONFIG.csvPath);
        const text = await response.text();
        const rows = text.trim().split('\n').map(row => row.split(','));
        
        // ヘッダー（1行目）を除外してオブジェクト化
        scenarioList = rows.slice(1).map(cols => ({
          condition: cols[0]?.trim(),
          image: cols[1]?.trim(),
          action: cols[2]?.trim(),
          speech: cols[3]?.trim(),
          log: cols[4]?.trim()
        })).filter(item => item.speech);

        console.log("CSV読み込み完了:", scenarioList.length, "件の生態データを登録");
      } catch (e) {
        console.error("CSV読み込みエラー:", e);
      }
    }

    // === ② 現在の時間・季節・イベント判定 ===
    function getActiveConditions() {
      const now = new Date();
      const hour = now.getHours();
      const month = now.getMonth() + 1;
      const date = now.getDate();

      const conditions = ['ALL'];

      // 時間帯判定
      if (hour >= 5 && hour < 11) conditions.push('朝');
      else if (hour >= 11 && hour < 17) conditions.push('昼');
      else conditions.push('夜');

      // 季節判定
      if (month === 12 || month <= 2) conditions.push('寒');
      if (month >= 7 && month <= 8) conditions.push('暑');

      // クリスマス判定
      if (month === 12 && date >= 18 && date <= 24) conditions.push('XMAS_PRE');
      if (month === 12 && date === 25) conditions.push('XMAS');

      return conditions;
    }

    // マーカー認識イベント
    anchor.addEventListener("targetFound", () => {
      isTargetFound = true;
      statusDot.classList.add('active');
      statusText.innerText = "小さな森の研究所：ともだちを観測中！";
      updatePanel("あっ！小さな森のともだちを発見！\nこんにちは〜！🍄", "【観測成功】生体反応をキャッチしました");
    });

    anchor.addEventListener("targetLost", () => {
      isTargetFound = false;
      statusDot.classList.remove('active');
      statusText.innerText = "小さな森の研究所：スキャン中";
      updatePanel("小さな森のともだちを探してね…🌱", "【観測待機】グッズやカードにレンズをかざしてください");
    });

    function updatePanel(speech, log) {
      dialogPanel.classList.add('panel-hidden');
      setTimeout(() => {
        speechText.innerText = speech;
        observationLog.innerText = log;
        dialogPanel.classList.remove('panel-hidden');
      }, 400);
    }

    // === ③ 次のシナリオをCSVから抽選 ===
    function nextScenario() {
      if (!isTargetFound || scenarioList.length === 0) {
        setTimeout(nextScenario, 1000);
        return;
      }

      // 現在の条件に一致するセリフを絞り込み
      const activeConditions = getActiveConditions();
      const availableList = scenarioList.filter(item => activeConditions.includes(item.condition));
      const chosen = availableList[Math.floor(Math.random() * availableList.length)];

      currentAction = chosen.action;

      // 画像を切り替え
      charaPlane.setAttribute('src', chosen.image);

      // 行動に応じた移動目標の設定
      if (currentAction === 'explore') {
        // 奥へ走る
        targetX = (Math.random() - 0.5) * CONFIG.areaRangeX;
        targetY = 0.2 + Math.random() * 0.4;
      } else if (currentAction === 'walk') {
        // お散歩
        targetX = (Math.random() - 0.5) * CONFIG.areaRangeX;
        targetY = (Math.random() - 0.5) * CONFIG.areaRangeY;
      } else {
        // 睡眠(sleep)、会話(talk)、ジャンプ(jump)はその場で
        targetX = currentX;
        targetY = currentY;
      }

      updatePanel(chosen.speech, `【生態ログ】${chosen.log}`);

      const delay = CONFIG.msgDurationMin + Math.random() * (CONFIG.msgDurationMax - CONFIG.msgDurationMin);
      setTimeout(nextScenario, delay);
    }

    // === ④ アニメーションループ（震え防止・安定版） ===
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isTargetFound) {
        let speed = 0;
        if (currentAction === 'walk') speed = 0.20;     // 移動速度を少し落ち着かせました
        if (currentAction === 'explore') speed = 0.35;

        const dx = targetX - currentX;
        const dy = targetY - currentY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // 目的地に近づいたらピタッと止まり、左右の高速反転（チラつき）を防ぐ
        if (dist > 0.05 && speed > 0) {
          const step = Math.min(speed * dt, dist);
          currentX += (dx / dist) * step;
          currentY += (dy / dist) * step;
          if (Math.abs(dx) > 0.03) facingX = dx > 0 ? 1 : -1;
        }

        animTimer += dt;
        let bounceZ = 0.05; // 浮き上がりの基準
        let tiltRot = 0;    // 傾き角度

        // --- ここで各アクションの揺れ幅を調整しています ---
        if (currentAction === 'sleep') {
          // 睡眠：とても静かに呼吸
          bounceZ += Math.sin(animTimer * 1.5) * 0.005;
        } else if (currentAction === 'jump') {
          // ジャンプ：ふんわり跳ねる
          bounceZ += Math.abs(Math.sin(animTimer * 4.0)) * 0.10;
        } else if (currentAction === 'explore' || currentAction === 'walk') {
          // 歩き・探索：以前の激しいブルブルを抑え、軽やかなトコトコ歩きに
          bounceZ += Math.abs(Math.sin(animTimer * 5.0)) * 0.015;
          tiltRot = Math.sin(animTimer * 5.0) * 2.0; // 左右の首振り角度を控えめに
        } else {
          // 会話中（talk）：ゆっくりふわふわ浮遊
          bounceZ += Math.sin(animTimer * 2.0) * 0.008;
        }

        charaPlane.setAttribute('scale', `${facingX} 1 1`);
        charaRoot.setAttribute('rotation', `0 0 ${tiltRot}`);
        charaRoot.setAttribute('position', `${currentX} ${currentY} ${bounceZ}`);
      }

      requestAnimationFrame(loop);
    }

    // 起動
    loadCSV().then(() => {
      nextScenario();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
