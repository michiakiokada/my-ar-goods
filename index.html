<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小さな森の研究所 - 観察カメラ 1号機</title>

  <!-- MindAR & A-Frame ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- 研究所デザインCSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==============================================
       1. 研究所 UI オーバーレイ（最前面）
  ============================================== -->
  <div id="ui-layer">
    <!-- ヘッダー（ステータス＆オートチューナー） -->
    <div class="header-bar">
      <div class="camera-badge-container">
        <div class="camera-badge">
          <div class="badge-dot"></div>
          <span>観察カメラ 1号機</span>
        </div>
        <!-- 手動切り替えボタン（2号機へ） -->
        <button class="channel-btn" onclick="triggerCameraRedirect()">カメラ2号機へ ➔</button>
      </div>

      <!-- 8秒オートチューナーゲージ -->
      <div class="tuner-box">
        <div class="tuner-label">
          <span>対象スキャン中…</span>
          <span id="tuner-time">チャンネル切替まで 8秒</span>
        </div>
        <div class="tuner-bar-track">
          <div id="tuner-bar" class="tuner-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- 中央スキャン照準枠 -->
    <div id="scan-guide" class="scan-guide"></div>

    <!-- 観測成功ログ（トースト通知） -->
    <div id="discovery-toast">【観察カメラ 1号】にて対象を観測！</div>

    <!-- フッターガイド -->
    <div class="footer-guide">グッズを枠に合わせてかざしてください</div>
  </div>

  <!-- 画面遷移時の暗転幕 -->
  <div id="fade-curtain"></div>

  <!-- ==============================================
       2. WebAR カメラ画面（MindAR）
  ============================================== -->
  <!-- 
    ※ imageTargetSrc にご自身の .mind ファイル（例: ./targets.mind）を指定してください。
    自作UIを使用するため、MindAR標準の枠(uiScanning)などは無効化しています。
  -->
  <a-scene
    id="ar-container"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 
      ターゲット 0番（1つ目のグッズ）
      通常観測時に表示される演出（※5%のスーパーリーチ当選時はここを通過してspへ飛びます）
    -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- 観察用ホログラム枠（静かに光るリング） -->
      <a-ring
        radius-inner="0.45" radius-outer="0.48"
        color="#81c784" opacity="0.8"
        rotation="0 0 0"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 10000; easing: linear">
      </a-ring>

      <!-- 通常観察用のふんわり揺れるキャラクタープレビュー（例：sp_kinoko.png） -->
      <a-image
        src="./sp/sp_kinoko.png"
        position="0 0 0.05"
        width="0.8" height="0.8"
        animation="property: position; to: 0 0.05 0.05; dir: alternate; loop: true; dur: 1200; easing: easeInOutQuad">
      </a-image>
    </a-entity>

    <!-- ※グッズが複数ある場合は targetIndex: 1, 2... と増やしていけます -->
  </a-scene>

  <!-- 研究所メインコントローラーJS -->
  <script src="main.js"></script>

</body>
</html>
